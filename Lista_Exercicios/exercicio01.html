<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia JS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row text-center">
            <div class="col">
                <h1>Farmácia JS</h1>
                <form action="">
                    <p>Medicamento: <input type="text" id="inNome" required></p>
                    <p>Preço R$: <input type="number" id="inPreco" min="0" step="0.01" required></p>
                    <input type="submit" value="Caucular desconto" class="btn btn-warning">
                </form>
                <h3 id="resp1"></h3>
                <h3 id="resp2"></h3>
            </div>
        </div>
    </div>
    <script src="js/ex01.js"></script>
</body>
</html>
